spring.profiles.active=dev
spring.datasource.url=jdbc:postgresql://db:5432/resurs
spring.datasource.username=resurs
spring.datasource.password=resurs123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.data.web.pageable.max-page-size = 100
spring.data.web.pageable.default-page-size = 20
server.port=8083
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
company-validation.client=mock
bankid.client=mock
springdoc.swagger-ui.csrf.enabled=true
# Rate limiting (per user, or per IP-address if not logged in
rate-limit.enabled=true
#How many requests a user can make at once
rate-limit.capacity=60
#How many requests are refilled per period (60 per minute = 1 per second on average)
rate-limit.refill-tokens=60
rate-limit.refill-period=1m
#Behind the proxy (stage/prod) so the client IP is read from X-Forwarded-For instead of the proxy's own address
server.forward-headers-strategy=native

