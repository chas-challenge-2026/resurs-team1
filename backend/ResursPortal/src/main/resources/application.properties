spring.profiles.active=dev
spring.datasource.url=jdbc:postgresql://db:5432/resurs
spring.datasource.username=resurs
spring.datasource.password=resurs123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.data.web.pageable.max-page-size = 100
spring.data.web.pageable.default-page-size = 20
server.port=8083
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
company-validation.client=mock
bankid.client=mock

resilience4j.retry.instances.company-lookup.max-attempts=3
resilience4j.retry.instances.company-lookup.wait-duration=500ms
resilience4j.retry.instances.company-lookup.enable-exponential-backoff=true
resilience4j.retry.instances.company-lookup.retry-exceptions=se.comerit.resurs.exception.companyvalidation.CompanyRegistryUnavailableException
resilience4j.circuitbreaker.instances.company-lookup.sliding-window-size=10
resilience4j.circuitbreaker.instances.company-lookup.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.company-lookup.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.company-lookup.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.company-lookup.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.company-lookup.record-exceptions=se.comerit.resurs.exception.companyvalidation.CompanyRegistryUnavailableException

resilience4j.retry.instances.annual-report.max-attempts=3
resilience4j.retry.instances.annual-report.wait-duration=500ms
resilience4j.retry.instances.annual-report.enable-exponential-backoff=true
resilience4j.retry.instances.annual-report.retry-exceptions=se.comerit.resurs.exception.companyvalidation.CompanyRegistryUnavailableException
resilience4j.circuitbreaker.instances.annual-report.sliding-window-size=10
resilience4j.circuitbreaker.instances.annual-report.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.annual-report.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.annual-report.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.annual-report.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.annual-report.record-exceptions=se.comerit.resurs.exception.companyvalidation.CompanyRegistryUnavailableException

resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2

springdoc.swagger-ui.csrf.enabled=true
# Rate limiting (per user, or per IP-address if not logged in
rate-limit.enabled=true
#How many requests a user can make at once
rate-limit.capacity=60
#How many requests are refilled per period (60 per minute = 1 per second on average)
rate-limit.refill-tokens=60
rate-limit.refill-period=1m
#Behind the proxy (stage/prod) so the client IP is read from X-Forwarded-For instead of the proxy's own address
server.forward-headers-strategy=native

