# - E-mail notifications -
# "log" only writes the e-mail to the log (default, safe on stage). "smtp" really sends it.
notification.client=log
notification.from=no-reply@resurs.se
# Only used when notification.client=smtp
spring.mail.host=localhost
spring.mail.port=1025
# Do not let a slow mail server hang the request
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
