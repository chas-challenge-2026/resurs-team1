<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Mina ansökningar – Resurs</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"/>
    <style>
        body { padding-top: 70px; background-color: #f5f5f5; }
    </style>
</head>
<body>
<nav class="navbar navbar-default navbar-fixed-top" style="background:#003366; border:none;">
    <div class="container">
        <a class="navbar-brand" style="color:#fff;" href="/">Resurs Kreditansökan</a>
        <div class="navbar-right" style="padding:15px;">
            <span style="color:#aac;" th:text="'Inloggad som: ' + ${companyName}">Företag</span>
            &nbsp;|&nbsp;
            <a href="/apply" style="color:#aac;">Ny ansökan</a>
            &nbsp;|&nbsp;
            <a href="/logout" style="color:#aac;">Logga ut</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1>Mina kreditansökningar</h1>
    </div>

    <div th:if="${applications == null or applications.isEmpty()}" class="alert alert-info">
        <p>Du har inga ansökningar ännu. <a href="/apply">Skapa din första ansökan</a>.</p>
    </div>

    <div th:if="${applications != null and !applications.isEmpty()}">
        <a href="/apply" class="btn btn-primary" style="margin-bottom:15px;">
            <span class="glyphicon glyphicon-plus"></span> Ny ansökan
        </a>
        <table class="table table-bordered table-hover" style="background:#fff;">
            <thead style="background:#003366; color:#fff;">
                <tr>
                    <th>#</th>
                    <th>Kreditbelopp</th>
                    <th>Syfte</th>
                    <th>Status</th>
                    <th>Inlämnad</th>
                    <th>Åtgärder</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="app : ${applications}">
                    <td th:text="${app.id}">0</td>
                    <td th:text="${#numbers.formatDecimal(app.requested_amount, 0, 'COMMA', 0, 'POINT')} + ' kr'">0</td>
                    <td th:text="${app.purpose}">Syfte</td>
                    <td>
                        <span class="label"
                              th:classappend="${app.status == 'APPROVED'} ? 'label-success' :
                                             (${app.status == 'REJECTED'} ? 'label-danger' :
                                             (${app.status == 'UNDER_REVIEW'} ? 'label-warning' : 'label-default'))"
                              th:text="${app.status}">STATUS</span>
                    </td>
                    <td th:text="${app.created_at}">datum</td>
                    <td>
                        <a th:href="'/status/' + ${app.id}" class="btn btn-xs btn-info">
                            <span class="glyphicon glyphicon-eye-open"></span> Visa
                        </a>
                        <a th:href="'/documents/' + ${app.id}" class="btn btn-xs btn-default">
                            <span class="glyphicon glyphicon-upload"></span> Dokument
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</body>
</html>
